apiVersion: batch/v1
kind: Job
metadata:
  name: spendledger-migrate
  namespace: spendledger
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/kebingz/spend-ledger:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: spendledger-config
            - secretRef:
                name: spendledger-secrets
