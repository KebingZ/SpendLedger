apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendledger-worker
  namespace: spendledger
  labels:
    app.kubernetes.io/name: spendledger
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spendledger
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spendledger
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: ghcr.io/kebingz/spend-ledger:latest
          command: ["python", "-m", "spendledger.worker"]
          envFrom:
            - configMapRef:
                name: spendledger-config
            - secretRef:
                name: spendledger-secrets
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
