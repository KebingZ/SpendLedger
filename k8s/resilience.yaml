apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spendledger-api
  namespace: spendledger
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spendledger
      app.kubernetes.io/component: api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spendledger-api
  namespace: spendledger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spendledger-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
