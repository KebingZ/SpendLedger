apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spendledger-default-deny
  namespace: spendledger
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spendledger-api-ingress
  namespace: spendledger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spendledger
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
