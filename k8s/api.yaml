apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendledger-api
  namespace: spendledger
  labels:
    app.kubernetes.io/name: spendledger
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spendledger
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spendledger
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/kebingz/spend-ledger:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: spendledger-config
            - secretRef:
                name: spendledger-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: spendledger-api
  namespace: spendledger
  labels:
    app.kubernetes.io/name: spendledger
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: spendledger
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
